name: Publish npm package

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Weavatrix/weavatrix-md'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/weavatrix-md.exe
          - platform: win32-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: target/aarch64-pc-windows-msvc/release/weavatrix-md.exe
          - platform: darwin-x64
            runner: macos-15
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/weavatrix-md
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/weavatrix-md
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/weavatrix-md
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: target/aarch64-unknown-linux-gnu/release/weavatrix-md
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install the declared Rust toolchain and target
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 "${{ matrix.target }}"
      - name: Build the release CLI
        shell: bash
        run: cargo +1.88.0 build --release --locked --target "${{ matrix.target }}" -p weavatrix-md
      - name: Verify the native binary identity
        shell: bash
        run: |
          VERSION="$(node -p "require('./npm/weavatrix-md/package.json').version")"
          CARGO_VERSION="$(cargo +1.88.0 metadata --locked --format-version 1 --no-deps | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s).packages.find(p=>p.name==='weavatrix-md');process.stdout.write(p.version)})")"
          [[ "$VERSION" == "$CARGO_VERSION" ]]
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            [[ "${{ github.ref_name }}" == "v$VERSION" ]]
          fi
          node -e "const {spawnSync}=require('node:child_process');const result=spawnSync(process.argv[1],['--version'],{encoding:'utf8'});const expected='weavatrix-md '+process.argv[2];if(result.status!==0||result.stdout.trim()!==expected){process.stderr.write(result.stderr||result.stdout);process.exit(1)}" \
            "${{ matrix.binary }}" "$VERSION"
      - name: Normalize the binary artifact layout
        shell: bash
        run: |
          mkdir -p "artifacts/${{ matrix.platform }}"
          cp "${{ matrix.binary }}" "artifacts/${{ matrix.platform }}/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.platform }}
          path: artifacts
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.repository == 'Weavatrix/weavatrix-md'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true
      - name: Assemble and verify the universal package
        shell: bash
        run: |
          VERSION="$(node -p "require('./npm/weavatrix-md/package.json').version")"
          node scripts/build-npm-packages.mjs universal binaries "$VERSION"
          npm pack ./npm/dist/weavatrix-md --dry-run --json
          ! find npm/dist/weavatrix-md -type f -path '*node_modules*' -print -quit | grep .
          node -e "
            const fs=require('node:fs');
            const p=JSON.parse(fs.readFileSync('./npm/dist/weavatrix-md/package.json','utf8'));
            if (p.dependencies || p.optionalDependencies || p.scripts) {
              throw new Error('npm package must have zero dependencies and no lifecycle scripts');
            }
            for (const platform of ['win32-x64','win32-arm64','darwin-x64','darwin-arm64','linux-x64','linux-arm64']) {
              const name = platform.startsWith('win32') ? 'weavatrix-md.exe' : 'weavatrix-md';
              if (!fs.existsSync('./npm/dist/weavatrix-md/bin/native/' + platform + '/' + name)) {
                throw new Error('missing native binary for ' + platform);
              }
            }
          "
      - name: Smoke-test the installed package
        shell: bash
        run: |
          PACKAGE="$(npm pack ./npm/dist/weavatrix-md --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s)[0].filename))")"
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT" "$PACKAGE"' EXIT
          npm install --prefix "$ROOT" --ignore-scripts --no-audit --no-fund "./$PACKAGE"
          VERSION="$(node -p "require('./npm/weavatrix-md/package.json').version")"
          [[ "$("$ROOT/node_modules/.bin/weavatrix-md" --version)" == "weavatrix-md $VERSION" ]]
      - name: Publish with NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          [[ -n "${NODE_AUTH_TOKEN:-}" ]] || { echo "NPM_TOKEN is not configured" >&2; exit 1; }
          VERSION="$(node -p "require('./npm/weavatrix-md/package.json').version")"
          if npm view "weavatrix-md@$VERSION" version >/dev/null 2>&1; then
            echo "weavatrix-md@$VERSION already exists"
          else
            # First create of an unscoped name: token only. --provenance asks npm
            # for an interactive OTP on a brand-new package even when NPM_TOKEN
            # can publish. Later versions keep provenance.
            if npm view weavatrix-md name >/dev/null 2>&1; then
              npm publish ./npm/dist/weavatrix-md --ignore-scripts --provenance --access public
            else
              npm publish ./npm/dist/weavatrix-md --ignore-scripts --access public
            fi
          fi
          for attempt in $(seq 1 24); do
            if npm view "weavatrix-md@$VERSION" version >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "weavatrix-md@$VERSION did not become visible on npm" >&2
          exit 1
