[package]
name = "weavatrix-md"
version = "0.2.3"
edition = "2024"
rust-version = "1.88"
description = "Tiny deterministic cross-repository integration map for coding agents"
license = "MIT"
authors = ["Sergii Ziborov <sergii.ziborov@gmail.com>"]
homepage = "https://weavatrix.com"
repository = "https://github.com/Weavatrix/weavatrix-md"
documentation = "https://docs.rs/weavatrix-md"
readme = "README.md"
keywords = ["weavatrix", "integration-map", "kafka", "static-analysis", "agents"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["npm/**", "scripts/**", "benchmark-results/**"]

[lib]
name = "weavatrix_md"
path = "src/lib.rs"

[[bin]]
name = "weavatrix-md"
path = "src/main.rs"
doc = false

[[bench]]
name = "generation"
harness = false

[dependencies]
weavatrix-scan = { version = "0.4.6", default-features = false }
weavatrix-parse = "0.3.3"
mcport = "0.5.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
case_sensitive_file_extension_comparisons = "allow"
